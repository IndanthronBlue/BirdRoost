[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "birdroost"
version = "0.1.0"
description = "羽栖 BirdRoost：基于懂鸟 API 的本地鸟图整理工具"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6>=6.7,<7",
  "requests>=2.31,<3",
  "Pillow>=10,<14",
  "piexif>=1.1,<2",
]

[project.urls]
Homepage = "https://github.com/IndanthronBlue/BirdRoost"
Repository = "https://github.com/IndanthronBlue/BirdRoost.git"
Issues = "https://github.com/IndanthronBlue/BirdRoost/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-qt>=4.4,<5",
  "responses>=0.25,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
birdclass = ["assets/*.csv", "assets/*.ico", "assets/taxonomy/*.csv", "assets/taxonomy/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
